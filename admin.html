<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Burger Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-top: #0f1117;
      --bg-bottom: #151820;
      --surface: rgba(18,19,26,0.85);
      --border: rgba(255,255,255,0.07);
      --accent: #e8ff47;
      --text: #eeeef2;
      --muted: #666680;
      --font-display: 'Inter', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    body {
      font-family: var(--font-body);
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      min-height: 100vh;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .admin-header h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.02em;
    }
    .admin-header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #0a0a0c;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(232,255,71,.28);
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-secondary:hover {
      border-color: rgba(232,255,71,.4);
      color: var(--text);
      box-shadow: none;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 12px 18px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    .tab-btn:hover { color: var(--text); }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: rgba(0,0,0,.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: rgba(232,255,71,.4);
      box-shadow: 0 0 12px rgba(232,255,71,.1);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-section h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
    }

    .items-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card h4 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      margin: 0;
    }

    .item-card p {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .item-actions button {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .item-actions button:hover {
      border-color: rgba(232,255,71,.35);
      color: var(--accent);
    }

    .item-actions .delete-btn:hover {
      border-color: #ff6b6b;
      color: #ff6b6b;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: min(600px, 90vw);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-close:hover { color: var(--text); }

    .success-msg {
      background: rgba(113,178,128,.15);
      border: 1px solid rgba(113,178,128,.3);
      color: #71b280;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .error-msg {
      background: rgba(255,107,107,.15);
      border: 1px solid rgba(255,107,107,.3);
      color: #ff6b6b;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-num {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 24px;
      color: var(--accent);
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
      .items-list { grid-template-columns: 1fr; }
      .admin-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="admin-container">

  <!-- HEADER -->
  <div class="admin-header">
    <h1>⚙️ Portfolio Admin</h1>
    <div class="admin-header-actions">
      <a href="index.html" class="btn btn-secondary"><i class="ph ph-arrow-left"></i> К портфолио</a>
      <button class="btn btn-secondary" onclick="exportData()"><i class="ph ph-download-simple"></i> Экспорт</button>
      <button class="btn btn-secondary" onclick="importData()"><i class="ph ph-upload-simple"></i> Импорт</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('projects')"><i class="ph ph-briefcase"></i> Проекты</button>
    <button class="tab-btn" onclick="switchTab('youtube')"><i class="ph ph-youtube-logo"></i> YouTube</button>
    <button class="tab-btn" onclick="switchTab('packaging')"><i class="ph ph-package"></i> Упаковка</button>
    <button class="tab-btn" onclick="switchTab('stats')"><i class="ph ph-chart-bar"></i> Статистика</button>
  </div>

  <!-- PROJECTS TAB -->
  <div id="projects" class="tab-content active">
    <div class="form-section">
      <h3>Добавить проект</h3>
      <div class="form-group">
        <label>Название</label>
        <input type="text" id="projTitle" placeholder="Название проекта">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="projDesc" placeholder="Описание проекта"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Категория</label>
          <select id="projCat">
            <option value="frontend">Frontend</option>
            <option value="ui">UI/UX</option>
            <option value="content">Контент</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ссылка</label>
          <input type="text" id="projLink" placeholder="https://example.com">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Иконка/Эмодзи</label>
          <input type="text" id="projEmoji" placeholder="🎨" value="💼">
        </div>
        <div class="form-group">
          <label>Теги (через запятую)</label>
          <input type="text" id="projTags" placeholder="HTML, CSS, JS">
        </div>
      </div>
      <button class="btn" onclick="addProject()" style="width: 100%;"><i class="ph ph-plus"></i> Добавить проект</button>
    </div>

    <div id="projectsList" class="items-list"></div>
  </div>

  <!-- YOUTUBE TAB -->
  <div id="youtube" class="tab-content">
    <div class="form-section">
      <h3>Добавить видео</h3>
      <div class="form-group">
        <label>ID видео YouTube</label>
        <input type="text" id="vidId" placeholder="yJ6uTqb0sFU">
      </div>
      <div class="form-group">
        <label>Название видео</label>
        <input type="text" id="vidTitle" placeholder="Название видео">
      </div>
      <button class="btn" onclick="addVideo()" style="width: 100%;"><i class="ph ph-plus"></i> Добавить видео</button>
    </div>

    <div id="videosList" class="items-list"></div>
  </div>

  <!-- PACKAGING TAB -->
  <div id="packaging" class="tab-content">
    <div class="form-section">
      <h3>Добавить упаковку</h3>
      <div class="form-group">
        <label>Название</label>
        <input type="text" id="packTitle" placeholder="Название работы">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="packDesc" placeholder="Описание упаковки"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Ссылка на файл</label>
          <input type="text" id="packLink" placeholder="упаковка.pdf">
        </div>
        <div class="form-group">
          <label>Тип файла</label>
          <select id="packType">
            <option value="PDF">PDF</option>
            <option value="PNG">PNG</option>
            <option value="JPG">JPG</option>
          </select>
        </div>
      </div>
      <button class="btn" onclick="addPackaging()" style="width: 100%;"><i class="ph ph-plus"></i> Добавить упаковку</button>
    </div>

    <div id="packagingList" class="items-list"></div>
  </div>

  <!-- STATS TAB -->
  <div id="stats" class="tab-content">
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-num" id="projCount">0</div>
        <div class="stat-label">Проектов</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="vidCount">0</div>
        <div class="stat-label">Видео</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="packCount">0</div>
        <div class="stat-label">Упаковок</div>
      </div>
    </div>

    <div class="form-section">
      <h3>Действия</h3>
      <button class="btn btn-secondary" onclick="clearAll()" style="width: 100%; margin-bottom: 10px;">
        <i class="ph ph-trash"></i> Очистить все данные
      </button>
      <button class="btn" onclick="syncWithHTML()" style="width: 100%;">
        <i class="ph ph-check"></i> Синхронизировать с HTML
      </button>
    </div>
  </div>

</div>

<!-- MODALS -->
<div id="editModal" class="modal">
  <div class="modal-box">
    <div class="modal-header">
      Редактировать проект
      <button class="modal-close" onclick="closeModal()"><i class="ph ph-x"></i></button>
    </div>
    <div id="editModalContent"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'portfolio_admin_data';

  const defaultData = {
    projects: [],
    videos: [],
    packaging: []
  };

  // Load data from localStorage
  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : defaultData;
  }

  // Save data to localStorage
  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    renderAll();
  }

  // Add Project
  function addProject() {
    const data = loadData();
    const title = document.getElementById('projTitle').value;
    const desc = document.getElementById('projDesc').value;
    const cat = document.getElementById('projCat').value;
    const link = document.getElementById('projLink').value;
    const emoji = document.getElementById('projEmoji').value;
    const tags = document.getElementById('projTags').value.split(',').map(t => t.trim());

    if (!title || !desc || !link) {
      alert('Заполни все обязательные поля');
      return;
    }

    data.projects.push({
      id: Date.now(),
      title,
      desc,
      cat,
      link,
      emoji,
      tags
    });

    saveData(data);
    document.getElementById('projTitle').value = '';
    document.getElementById('projDesc').value = '';
    document.getElementById('projLink').value = '';
    document.getElementById('projTags').value = '';
  }

  // Add Video
  function addVideo() {
    const data = loadData();
    const id = document.getElementById('vidId').value;
    const title = document.getElementById('vidTitle').value;

    if (!id || !title) {
      alert('Заполни ID видео и название');
      return;
    }

    data.videos.push({
      id: Date.now(),
      vidId: id,
      title
    });

    saveData(data);
    document.getElementById('vidId').value = '';
    document.getElementById('vidTitle').value = '';
  }

  // Add Packaging
  function addPackaging() {
    const data = loadData();
    const title = document.getElementById('packTitle').value;
    const desc = document.getElementById('packDesc').value;
    const link = document.getElementById('packLink').value;
    const type = document.getElementById('packType').value;

    if (!title || !link) {
      alert('Заполни название и ссылку');
      return;
    }

    data.packaging.push({
      id: Date.now(),
      title,
      desc,
      link,
      type
    });

    saveData(data);
    document.getElementById('packTitle').value = '';
    document.getElementById('packDesc').value = '';
    document.getElementById('packLink').value = '';
  }

  // Render Projects
  function renderProjects() {
    const data = loadData();
    const container = document.getElementById('projectsList');
    container.innerHTML = data.projects.map(proj => `
      <div class="item-card">
        <div style="font-size: 32px;">${proj.emoji}</div>
        <h4>${proj.title}</h4>
        <p>${proj.desc}</p>
        <p style="color: var(--accent); font-size: 11px;"><strong>Категория:</strong> ${proj.cat}</p>
        <div class="item-actions">
          <button onclick="editProject(${proj.id})"><i class="ph ph-pencil"></i> Редактировать</button>
          <button class="delete-btn" onclick="deleteProject(${proj.id})"><i class="ph ph-trash"></i> Удалить</button>
        </div>
      </div>
    `).join('');
    document.getElementById('projCount').textContent = data.projects.length;
  }

  // Render Videos
  function renderVideos() {
    const data = loadData();
    const container = document.getElementById('videosList');
    container.innerHTML = data.videos.map(vid => `
      <div class="item-card">
        <div style="font-size: 32px;">▶️</div>
        <h4>${vid.title}</h4>
        <p style="color: var(--muted); font-size: 11px;">ID: ${vid.vidId}</p>
        <div class="item-actions">
          <button onclick="deleteVideo(${vid.id})"><i class="ph ph-trash"></i> Удалить</button>
        </div>
      </div>
    `).join('');
    document.getElementById('vidCount').textContent = data.videos.length;
  }

  // Render Packaging
  function renderPackaging() {
    const data = loadData();
    const container = document.getElementById('packagingList');
    container.innerHTML = data.packaging.map(pack => `
      <div class="item-card">
        <div style="font-size: 32px;">📦</div>
        <h4>${pack.title}</h4>
        <p>${pack.desc}</p>
        <p style="color: var(--accent); font-size: 11px;"><strong>Тип:</strong> ${pack.type}</p>
        <div class="item-actions">
          <button onclick="deletePackaging(${pack.id})"><i class="ph ph-trash"></i> Удалить</button>
        </div>
      </div>
    `).join('');
    document.getElementById('packCount').textContent = data.packaging.length;
  }

  // Delete functions
  function deleteProject(id) {
    if (!confirm('Удалить этот проект?')) return;
    const data = loadData();
    data.projects = data.projects.filter(p => p.id !== id);
    saveData(data);
  }

  function deleteVideo(id) {
    if (!confirm('Удалить это видео?')) return;
    const data = loadData();
    data.videos = data.videos.filter(v => v.id !== id);
    saveData(data);
  }

  function deletePackaging(id) {
    if (!confirm('Удалить эту упаковку?')) return;
    const data = loadData();
    data.packaging = data.packaging.filter(p => p.id !== id);
    saveData(data);
  }

  // Tab switching
  function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
  }

  // Export data
  function exportData() {
    const data = loadData();
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'portfolio-data.json';
    a.click();
  }

  // Import data
  function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
          renderAll();
          alert('Данные импортированы!');
        } catch {
          alert('Ошибка при импорте файла');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  // Clear all
  function clearAll() {
    if (!confirm('Это удалит ВСЕ данные! Ты уверен?')) return;
    localStorage.removeItem(STORAGE_KEY);
    renderAll();
    alert('Все данные очищены');
  }

  // Render all
  function renderAll() {
    renderProjects();
    renderVideos();
    renderPackaging();
  }

  // Init
  window.addEventListener('load', renderAll);
</script>

</body>
</html>
